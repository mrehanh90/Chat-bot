<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrator Login</title><style>body{margin:0;background:#f5f7fb;color:#182230;font:16px system-ui,Segoe UI,sans-serif}.card{max-width:390px;margin:80px auto;background:#fff;border:1px solid #dfe5ee;border-radius:12px;padding:25px}label{display:block;font-weight:650;margin:14px 0 6px}input,button{box-sizing:border-box;width:100%;padding:11px;border-radius:7px;font:inherit}input{border:1px solid #aebaca}button{margin-top:20px;border:0;background:#096b42;color:#fff;cursor:pointer}#message{font-weight:650;min-height:24px}</style></head>
<body><main class="card"><h1>Administrator Login</h1><p>Sign in to manage active WhatsApp sessions.</p><form id="loginForm"><label for="username">Username</label><input id="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="login" type="submit">Sign in to administration</button></form><p id="message" role="alert"></p><p><a href="/">Return to public linking page</a></p></main><script>document.getElementById('loginForm').onsubmit=async(event)=>{event.preventDefault();const message=document.getElementById('message');const button=document.getElementById('login');message.textContent='';button.disabled=true;try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Login failed.');location.assign('/admin')}catch(error){message.textContent=error.message;button.disabled=false}};</script></body>
</html>
